<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오프라인 - 현풍닭칼국수</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #F9F6F3 0%, #FFF5E6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      background: #D61C1C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }

    .icon svg {
      width: 64px;
      height: 64px;
      fill: white;
    }

    h1 {
      font-size: 2rem;
      color: #2E1C10;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.125rem;
      color: #8B7355;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .retry-button {
      background: #D61C1C;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .retry-button:hover {
      background: #B01616;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(214, 28, 28, 0.3);
    }

    .retry-button:active {
      transform: translateY(0);
    }

    .tips {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #F9F6F3;
      border-radius: 1rem;
      text-align: left;
    }

    .tips h3 {
      font-size: 1rem;
      color: #2E1C10;
      margin-bottom: 0.75rem;
    }

    .tips ul {
      list-style: none;
      font-size: 0.875rem;
      color: #8B7355;
    }

    .tips li {
      padding: 0.5rem 0;
      padding-left: 1.5rem;
      position: relative;
    }

    .tips li::before {
      content: "•";
      position: absolute;
      left: 0.5rem;
      color: #D61C1C;
      font-weight: bold;
    }

    .credit {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #8B7355;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>

    <h1>인터넷 연결이 끊겼습니다</h1>
    <p>
      현재 오프라인 상태입니다.<br>
      인터넷 연결을 확인하고 다시 시도해주세요.
    </p>

    <button class="retry-button" onclick="window.location.reload()">
      다시 시도
    </button>

    <div class="tips">
      <h3>💡 확인사항</h3>
      <ul>
        <li>Wi-Fi 또는 모바일 데이터가 켜져 있는지 확인하세요</li>
        <li>비행기 모드가 꺼져 있는지 확인하세요</li>
        <li>라우터를 재시작해보세요</li>
      </ul>
    </div>

    <p class="credit">
      © 2024 KS컴퍼니 (사업자번호: 553-17-00098)
    </p>
  </div>
</body>
</html>
