<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테스트 페이지</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #D61C1C 0%, #F37021 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      color: #2E1C10;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #D61C1C;
      margin-top: 0;
    }
    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      background: #f0f0f0;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    button {
      background: #D61C1C;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #b01616;
    }
    .info {
      font-size: 14px;
      color: #666;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 현풍닭칼국수 - 시스템 테스트</h1>
    
    <div class="status success" id="status">
      ✅ HTML이 정상적으로 로드되었습니다!
    </div>
    
    <div class="status" id="js-status">
      ⏳ JavaScript 확인 중...
    </div>
    
    <div class="status" id="react-status">
      ⏳ React 앱 확인 중...
    </div>
    
    <div style="margin-top: 20px;">
      <button onclick="window.location.href='/'">메인 앱으로 이동</button>
      <button onclick="window.location.href='/debug'">디버그 페이지</button>
      <button onclick="checkSystem()">시스템 재확인</button>
    </div>
    
    <div class="info">
      <strong>KS컴퍼니</strong><br>
      사업자번호: 553-17-00098<br>
      대표: 석경선 / 공동대표: 배종수
    </div>
  </div>
  
  <script>
    console.log('테스트 페이지 로드 완료');
    
    // JavaScript 동작 확인
    document.getElementById('js-status').innerHTML = '✅ JavaScript가 정상 작동합니다!';
    document.getElementById('js-status').className = 'status success';
    
    // React 앱 상태 확인
    function checkSystem() {
      const reactStatus = document.getElementById('react-status');
      
      fetch('/')
        .then(response => {
          if (response.ok) {
            reactStatus.innerHTML = '✅ 서버 응답 정상';
            reactStatus.className = 'status success';
          } else {
            reactStatus.innerHTML = '⚠️ 서버 응답 오류: ' + response.status;
            reactStatus.className = 'status error';
          }
        })
        .catch(error => {
          reactStatus.innerHTML = '❌ 연결 실패: ' + error.message;
          reactStatus.className = 'status error';
        });
    }
    
    // 페이지 로드 시 자동 확인
    setTimeout(checkSystem, 500);
    
    // 환경 정보 출력
    console.log('User Agent:', navigator.userAgent);
    console.log('Window Size:', window.innerWidth + 'x' + window.innerHeight);
    console.log('Online Status:', navigator.onLine);
  </script>
</body>
</html>
